version: '3.9'

services:
  mysql:
    image: hub.chopinsight.cn/mysql:9.7.0
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=chopinsight_api
      - MYSQL_USER=api_gateway
      - MYSQL_PASSWORD={{API_GATEWAY_MYSQL_PASSWORD}}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --silent"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

  api-gateway:
    depends_on:
      - mysql
    image: hub.chopinsight.cn/chopinsight/internalimages/api_gateway:latest
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=api_gateway
      - MYSQL_PASSWORD={{API_GATEWAY_MYSQL_PASSWORD}}
      - MYSQL_DB=chopinsight_api
      - PROXY_SIGN_SECRET={{PROXY_SIGN_SECRET}}
    networks:
      - internal
      - proxy_app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

networks:
  internal:
    driver: overlay
  proxy_app:
    external: true

volumes:
  mysql-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/gateway/mysql
