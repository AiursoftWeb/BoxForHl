version: '3.9'

services:
  api-gateway:
    image: hub.chopinsight.cn/chopinsight/internalimages/api_gateway:latest
    environment:
      - MYSQL_HOST=139.9.132.162
      - MYSQL_PORT=3306
      - MYSQL_USER=kuci_api
      - MYSQL_PASSWORD=Axx0iQoHbWe3ZTZt
      - MYSQL_DB=chopinsight_api
      - PROXY_SIGN_SECRET=K9f2Lm8Qx1Rv6Tn3Wp7Hs4Zd0By5CgUa
    networks:
      - proxy_app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

networks:
  proxy_app:
    external: true
