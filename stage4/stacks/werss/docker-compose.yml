version: '3.9'

services:
  authentik_proxy:
    image: hub.chopinsight.cn/ghcr.io/goauthentik/proxy:2026.2.1
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm
        read_only: false
    environment:
      AUTHENTIK_HOST: "https://auth.chopinsight.cn/"
      AUTHENTIK_INSECURE: "false"
      AUTHENTIK_TOKEN: "{{WERSS_OUTPOST_TOKEN}}"
    networks:
      - proxy_app
      - internal
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  server:
    image: hub.chopinsight.cn/rachelos/we-mp-rss:latest
    volumes:
      - werss-data:/app/data
    networks:
      - proxy_app
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      update_config:
        order: stop-first
        delay: 60s

networks:
  proxy_app:
    external: true
  internal:
    driver: overlay

volumes:
  werss-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/werss/data
