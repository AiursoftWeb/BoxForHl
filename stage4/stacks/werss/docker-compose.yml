version: '3.9'

services:
  server:
    image: hub.chopinsight.cn/rachelos/we-mp-rss:latest
    volumes:
      - werss-data:/app/data
    networks:
      - proxy_app
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8001)); s.close()\" 2>/dev/null || python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8001)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      update_config:
        order: stop-first
        delay: 60s

  chat:
    image: hub.chopinsight.cn/chopinsight/internalimages/werss_chat:latest
    environment:
      - DEEPSEEK_API_KEY={{DEEPSEEK_API_KEY}}
    networks:
      - proxy_app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      update_config:
        order: start-first
        delay: 5s

networks:
  proxy_app:
    external: true

volumes:
  werss-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/werss/data
