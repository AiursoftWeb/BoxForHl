version: '3.9'

services:
  server:
    image: hub.chopinsight.cn/rachelos/we-mp-rss:latest
    volumes:
      - werss-data:/app/data
    networks:
      - proxy_app
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8001)); s.close()\" 2>/dev/null || python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8001)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      update_config:
        order: stop-first
        delay: 60s

networks:
  proxy_app:
    external: true

volumes:
  werss-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/werss/data
