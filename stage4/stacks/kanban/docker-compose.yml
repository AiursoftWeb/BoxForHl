version: "3.9"

services:
  app:
    depends_on:
      - db
    image: hub.hlwuxi.com/aiursoft/kanban:latest
    volumes:
      - kanban-aspnet:/data/.aspnet/
      - kanban-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=kanban;Uid=kanban;Pwd=<kanban_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.hlwuxi.com/application/o/kanban
      - AppSettings__OIDC__ClientId={{KANBAN_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{KANBAN_CLIENT_SECRET}}
      - AppSettings__Anthropic__Token={{KANBAN_ANTHROPIC_API_KEY}}
      - AppSettings__Anthropic__CompletionApiUrl=https://ollama.hlwuxi.com/v1/messages/
      - AppSettings__Anthropic__Model=aiursoft-instruct:latest
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=KanbanLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  db:
    image: hub.hlwuxi.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - kanban-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=kanban
      - MYSQL_USER=kanban
      - MYSQL_PASSWORD=<kanban_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  kanban-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/kanban-data/files
  kanban-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/kanban-data/aspnet
  kanban-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/kanban-data/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay
