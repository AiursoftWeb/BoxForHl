version: '3.9'

services:
  app:
    image: hub.chopinsight.cn/chopinsight/internalimages/findata_engine:latest
    environment:
      - PG_HOST=pg_postgresql
      - PG_PORT=5432
      - PG_USER=chopinsight
      - PG_PASSWORD={{PG_PASSWORD}}
      - PG_DB=chopinsight
      - EMBEDDING_API_URL={{FINDATA_EMBEDDING_API_URL}}
      - EMBEDDING_API_KEY={{FINDATA_EMBEDDING_API_KEY}}
      - OCR_API_URL=http://ocr_app:8000/api/ocr
      - USE_GPU=false
      - MAX_CONCURRENT_TASKS=5
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      start_period: 30s
      interval: 30s
      retries: 3
      timeout: 10s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

networks:
  internal:
    driver: overlay
