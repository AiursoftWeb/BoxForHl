      # PostgreSQL (pgvector)
      - POSTGRES_HOST=110.42.61.186
      - POSTGRES_PORT=5432
      - POSTGRES_USER=chopinsight
      - POSTGRES_PASSWORD=GIEF12JK8NG6UE4RI2FLSPQPFK
