# ChopChat — REITs Knowledge Agent
chat.chopinsight.cn {
    log
    import hsts
    encode br gzip
    reverse_proxy http://chopchat_app:8100 {
        # SSE long-connection tuning: backend has 200s agent timeout,
        # Caddy must not kill the connection before that + retry.
        transport http {
            write_timeout 360s
            read_timeout  360s
        }
    }
}
