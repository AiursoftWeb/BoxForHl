version: '3.9'

services:
  app:
    image: hub.chopinsight.cn/chopinsight/internalimages/sftp_relay:latest
    volumes:
      - cache:/chroot/data
      - host-keys:/etc/ssh
    environment:
      # 容器走 chopart NAT 出去源 IP=31.56（办公室），不在上游白名单里。
      # 110.42.61.186 上跑 socat 把 4022 转发到真正的 182.151.45.185:4022，
      # 上游看到的源 IP 就是 110.42（已在白名单）。
      - SOURCE_HOST=110.42.61.186
      - SOURCE_PORT=4022
      - SOURCE_USER=chdata20260601
      - SOURCE_ROOT=/
      - DOWNSTREAM_IP=222.73.29.120
      - TTL_DAYS=3
      - FRP_SERVER={{FRP_SERVER}}
      - FRP_TOKEN={{FRP_TOKEN}}
      - LANGCHAO_SOURCE_PASSWORD={{LANGCHAO_SOURCE_PASSWORD}}
      - LANGCHAO_DOWNSTREAM_PASSWORD={{LANGCHAO_DOWNSTREAM_PASSWORD}}
      - CLICKHOUSE_HOST=clickhouse_clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD={{CLICKHOUSE_PASSWORD}}
    networks:
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: any
        delay: 10s

networks:
  internal:
    driver: overlay
  clickhouse_net:
    external: true

volumes:
  cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/sftp-relay/cache
  host-keys:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/sftp-relay/host-keys
