version: '3.9'

services:
  app:
    image: hub.chopinsight.cn/chopinsight/internalimages/sftp_relay:latest
    volumes:
      - cache:/chroot/data
      - host-keys:/etc/ssh
    environment:
      - SOURCE_HOST=182.151.45.185
      - SOURCE_PORT=4022
      - SOURCE_USER=chdata20260601
      - SOURCE_ROOT=/
      - DOWNSTREAM_IP=222.73.29.120
      - TTL_DAYS=3
      - FRP_SERVER={{FRP_SERVER}}
      - FRP_TOKEN={{FRP_TOKEN}}
      - LANGCHAO_SOURCE_PASSWORD={{LANGCHAO_SOURCE_PASSWORD}}
      - LANGCHAO_DOWNSTREAM_PASSWORD={{LANGCHAO_DOWNSTREAM_PASSWORD}}
      - CLICKHOUSE_HOST=clickhouse_clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD={{CLICKHOUSE_PASSWORD}}
    networks:
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: any
        delay: 10s

networks:
  internal:
    driver: overlay
  clickhouse_net:
    external: true

volumes:
  # Docker-managed 卷（data-root=/swarm-vol/docker-data，实际数据仍在 /swarm-vol 下）
  # 不用 bind mount 是因为 deploy.sh:407 的 mkdir 块包在 stage-0 if 里，
  # 用户跑 --stage 4 时会跳过 → 目录不存在 → 容器死循环挂载失败。
  cache:
  host-keys:
