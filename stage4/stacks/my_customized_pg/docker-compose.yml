version: '3.9'

services:
  postgresql:
    image: hub.chopinsight.cn/chopinsight/internalimages/my_customized_pg:latest
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: "{{MY_CUSTOMIZED_PG_PASSWORD}}"
      POSTGRES_USER: chopinsight
      POSTGRES_DB: chopinsight
    networks:
      - frp_net
      - internal
    ports:
      # These ports are for internal use. For external, FRP will handle it.
      # PostgreSQL default port (pgvector instance, port 5433 to avoid conflict with main pg)
      - target: 5432
        published: 5433
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

networks:
  frp_net:
    external: true
  internal:
    driver: overlay

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/my_customized_pg/postgres-database
