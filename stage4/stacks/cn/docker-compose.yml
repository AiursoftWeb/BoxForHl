version: "3.9"

services:
  app:
    # Placeholder site for the historical Tencent Cloud filing-access arrangement.
    # This is not a production content service; its local data is disposable.
    # A persistent application data volume is intentionally unnecessary.
    image: hub.hlwuxi.com/aiursoft/marktohtml:latest
    networks:
      - proxy_app
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

networks:
  proxy_app:
    external: true