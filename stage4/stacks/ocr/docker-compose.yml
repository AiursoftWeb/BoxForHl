version: '3.9'

services:
  app:
    image: localhost:8080/box_starting/local_paddleocr:latest
    environment:
      - OCR_ACCESS_TOKEN={{OCR_ACCESS_TOKEN}}
      - USE_GPU=true
      - HTTP_PROXY=http://xray:10809
      - HTTPS_PROXY=http://xray:10809
      - NO_PROXY=10.0.0.0/8,localhost,127.0.0.1
    volumes:
      - type: tmpfs
        target: /dev/shm
      - paddleocr-venv:/opt/venv
      - paddleocr-cache:/root/.cache
    networks:
      - proxy_app
      - internal
      - xray_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3600s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '16.0'
          memory: 12G
      update_config:
        order: start-first
        delay: 5s

volumes:
  paddleocr-venv:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ocr-data/venv
  paddleocr-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ocr-data/cache

networks:
  proxy_app:
    external: true
  internal:
    driver: overlay
  xray_net:
    external: true
