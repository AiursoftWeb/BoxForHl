version: "3.9"

services:
  clickhouse:
    image: hub.chopinsight.cn/chopinsight/internalimages/level2_clickhouse:latest

    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=123456
      - CLICKHOUSE_TELEMETRY_OPT_OUT=1
      - CLICKHOUSE_DO_NOT_CHECK_UPDATES=1

    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-log:/var/log/clickhouse-server

    networks:
      - internal
      - proxy_app
      - clickhouse_net

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8124/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    stop_grace_period: 60s

    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        delay: 60s
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: "4.0"
          memory: 16G
        reservations:
          cpus: "2.0"
          memory: 4G

  initializer:
    image: hub.chopinsight.cn/chopinsight/internalimages/level2_initializer:latest

    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8124"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "123456"

    networks:
      - internal

    depends_on:
      - clickhouse

    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  etl:
    image: hub.chopinsight.cn/chopinsight/internalimages/level2_etl:latest

    volumes:
      - etl-cache:/data

    environment:
      SFTP_PASSWORD: "0zRCQCPgPk48R8jy0jv5rdfAjaSHu9NS-a2Dgt9QJ-A="
      # 压缩后暂停（改 0 恢复自动导入 hist2/hist1）
      LEVEL2_COMPRESS_ONLY: "1"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8124"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "123456"
      # 中心 CH（Grafana 可读）第二路日志 → level2.app_log，用于外部监控
      LOG_CLICKHOUSE_HOST: clickhouse_clickhouse
      LOG_CLICKHOUSE_PORT: "8123"
      LOG_CLICKHOUSE_USER: default
      LOG_CLICKHOUSE_PASSWORD: "{{CLICKHOUSE_PASSWORD}}"
      LOG_CLICKHOUSE_DB: level2

    networks:
      - internal
      - clickhouse_net
      - proxy_app

    depends_on:
      - clickhouse

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8202/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

    stop_grace_period: 20s

    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
      restart_policy:
        condition: any
        delay: 30s
      resources:
        limits:
          cpus: "8.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 2G
      labels:
        - "shepherd.autoupdate=true"

  sync:
    image: hub.chopinsight.cn/chopinsight/internalimages/level2_sync:latest

    volumes:
      - sync-checkpoints:/data/checkpoints

    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8124"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "123456"

    networks:
      - internal
      - clickhouse_net

    depends_on:
      - clickhouse

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8203/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    stop_grace_period: 20s

    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
      labels:
        - "shepherd.autoupdate=true"

networks:
  internal:
    driver: overlay
  proxy_app:
    external: true
    name: proxy_app
  clickhouse_net:
    external: true
    name: clickhouse_net

volumes:
  clickhouse-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/level2/clickhouse-data
  clickhouse-log:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/level2/clickhouse-log
  etl-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/level2/etl-cache
  sync-checkpoints:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/level2/sync-checkpoints
