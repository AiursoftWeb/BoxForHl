version: '3.9'

services:
  postgresql:
    image: hub.chopinsight.cn/postgres:16-alpine
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: {{PG_PASSWORD}}
      POSTGRES_USER: chopinsight
      POSTGRES_DB: chopinsight
    networks:
      - frp_net
    ports:
      # These ports are for internal use. For external, FRP will handle it.
      # PostgreSQL default port
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

networks:
  frp_net:
    external: true

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/chopinsight-postgres/postgres-database
