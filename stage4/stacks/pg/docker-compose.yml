version: '3.9'

services:
  postgresql:
    image: hub.chopinsight.cn/chopinsight/internalimages/my_customized_pg:latest
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: "{{PG_PASSWORD}}"
      POSTGRES_USER: chopinsight
      POSTGRES_DB: chopinsight
    networks:
      - frp_net
      - internal
      - pg_net
    ports:
      # These ports are for internal use. For external, FRP will handle it.
      # PostgreSQL default port
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 60s
      interval: 30s
      retries: 5
      timeout: 5s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

  findata-initializer:
    depends_on:
      - postgresql
    image: hub.chopinsight.cn/chopinsight/internalimages/findata_initializer:latest
    environment:
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=chopinsight
      - PG_PASSWORD={{PG_PASSWORD}}
      - PG_DB=chopinsight
      # ClickHouse
      - CLICKHOUSE_HOST=clickhouse_clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD={{CLICKHOUSE_PASSWORD}}
    networks:
      - internal
      - clickhouse_net
    deploy:
      labels:
        shepherd.autoupdate: "true"
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  findata-engine:
    depends_on:
      - postgresql
    image: hub.chopinsight.cn/chopinsight/internalimages/findata_engine:latest
    volumes:
      - findata-pdfs:/tmp/findata_pdfs
    # Note: 1000+ page PDFs need >4G memory for text extraction
    environment:
      # PostgreSQL
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=chopinsight
      - PG_PASSWORD={{PG_PASSWORD}}
      - PG_PASSWORD_FILE=/run/secrets/PG_PASSWORD
      - PG_DB=chopinsight
      # MySQL (main_factory)
      - MYSQL_HOST=139.9.132.162
      - MYSQL_PORT=3306
      - MYSQL_USER=db_yuzhong_v2
      - MYSQL_PASSWORD={{FINDATA_MYSQL_PASSWORD}}
      - MYSQL_PASSWORD_FILE=/run/secrets/FINDATA_MYSQL_PASSWORD
      - MYSQL_DB=db_yuzhong_v2
      # Ollama embedding (外部接口)
      - OLLAMA_GATEWAY_URL=https://ollama.chopinsight.cn
      - OLLAMA_EMBEDDING_MODEL=bge-m3:latest
      - OLLAMA_API_KEY={{OLLAMA_API_KEY}}
      - OLLAMA_API_KEY_FILE=/run/secrets/OLLAMA_API_KEY
      # 豆包 embedding (兜底)
      - EMBEDDING_API_URL=https://ark.cn-beijing.volces.com/api/v3
      - EMBEDDING_API_KEY={{FINDATA_EMBEDDING_API_KEY}}
      - EMBEDDING_API_KEY_FILE=/run/secrets/FINDATA_EMBEDDING_API_KEY
      # MinIO (chopart 本机)
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY={{MINIO_ROOT_USER}}
      - MINIO_SECRET_KEY={{MINIO_ROOT_PASSWORD}}
      - MINIO_ACCESS_KEY_FILE=/run/secrets/MINIO_ROOT_USER
      - MINIO_SECRET_KEY_FILE=/run/secrets/MINIO_ROOT_PASSWORD
      - MINIO_BUCKET=finreports
      - MINIO_SECURE=false
      - MINIO_EXTERNAL_URL=https://minio.chopinsight.cn
      # OCR
      - OCR_API_URL=http://ocr_app:8000/api/ocr
      - OCR_ACCESS_TOKEN={{OCR_ACCESS_TOKEN}}
      - OCR_ACCESS_TOKEN_FILE=/run/secrets/OCR_ACCESS_TOKEN
      # PDF
      - PDF_DOWNLOAD_DIR=/tmp/findata_pdfs
      # Vectorizer
      - EMBEDDING_DIMENSION=1024
      - EMBEDDING_CHUNK_SIZE=1200
      - EMBEDDING_CHUNK_OVERLAP=1000
      - EMBEDDING_LEAF_ONLY=true
      - MAX_CONCURRENT_TASKS=5
      # ClickHouse 日志
      - CLICKHOUSE_HOST=clickhouse_clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD={{CLICKHOUSE_PASSWORD}}
      - CLICKHOUSE_DB=findata
    networks:
      - internal
      - proxy_app
      - clickhouse_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8200/health || exit 1"]
      start_period: 300s
      interval: 30s
      timeout: 10s
      retries: 5
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: any
        delay: 10s

  operation-engine:
    depends_on:
      - postgresql
    image: hub.chopinsight.cn/chopinsight/internalimages/operation_engine:latest
    environment:
      # PostgreSQL (同 stack 内直接用服务名)
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=chopinsight
      - PG_PASSWORD={{PG_PASSWORD}}
      - PG_DB=chopinsight
      # MySQL (main_factory)
      - MYSQL_HOST=139.9.132.162
      - MYSQL_PORT=3306
      - MYSQL_USER=db_yuzhong_v2
      - MYSQL_PASSWORD={{FINDATA_MYSQL_PASSWORD}}
      - MYSQL_DB=db_yuzhong_v2
      # Ollama
      - OLLAMA_GATEWAY_URL=https://ollama.chopinsight.cn
      - OLLAMA_CHAT_MODEL=aiursoft-instruct:latest
      - OLLAMA_API_KEY={{OLLAMA_API_KEY}}
      # ClickHouse 日志
      - CLICKHOUSE_HOST=clickhouse_clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD={{CLICKHOUSE_PASSWORD}}
      - CLICKHOUSE_DB=operation_engine
      # 服务配置
      - DEBUG=false
      - SCAN_INTERVAL_MINUTES=60
      - MAX_CONCURRENT_TASKS=3
      - MAX_RETRY_COUNT=3
    networks:
      - internal
      - proxy_app
      - clickhouse_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8201/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  service-api:
    image: hub.chopinsight.cn/chopinsight/internalimages/service_api:latest
    environment:
      - MYSQL_HOST=139.9.132.162
      - MYSQL_PORT=3306
      - MYSQL_USER=db_yuzhong_v2
      - MYSQL_PASSWORD={{FINDATA_MYSQL_PASSWORD}}
      - MYSQL_DB=db_yuzhong_v2
      - DEBUG=false
      - SERVICE_PORT=8240
      - CLICKHOUSE_HOST=clickhouse_clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD={{CLICKHOUSE_PASSWORD}}
      - CLICKHOUSE_DB=service_api
      - ADMIN_PASSWORD={{ADMIN_PASSWORD}}
      - PROXY_SIGN_SECRET={{PROXY_SIGN_SECRET}}
    networks:
      - internal
      - proxy_app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8240/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  valuation-engine:
    depends_on:
      - postgresql
    image: hub.chopinsight.cn/chopinsight/internalimages/valuation_engine:latest
    environment:
      # PostgreSQL (同 stack 内直接用服务名；读 ai_valuation_report_md)
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=chopinsight
      - PG_PASSWORD={{PG_PASSWORD}}
      - PG_DB=chopinsight
      # MySQL (db_yuzhong_v2；读写 chong_valuation_*_v1)
      - MYSQL_HOST=139.9.132.162
      - MYSQL_PORT=3306
      - MYSQL_USER=db_yuzhong_v2
      - MYSQL_PASSWORD={{FINDATA_MYSQL_PASSWORD}}
      - MYSQL_DB=db_yuzhong_v2
      # Ollama
      - OLLAMA_GATEWAY_URL=https://ollama.chopinsight.cn
      - OLLAMA_CHAT_MODEL=aiursoft-instruct:latest
      - OLLAMA_API_KEY={{OLLAMA_API_KEY}}
      # ExtractionEngine（同 stack 内直接用服务名）
      - EXTRACTION_ENGINE_URL=http://pg_extraction-engine:8205
      # 服务配置
      - DEBUG=false
      - SCAN_INTERVAL_MINUTES=60
      - SCAN_INTERVAL_ACTIVE_MINUTES=10
      - SCAN_ACTIVE_DAYS=3
      - MAX_CONCURRENT_TASKS=3
      - MAX_CONCURRENT_OLLAMA=1
      - MAX_RETRY_COUNT=3
    networks:
      - internal
      - proxy_app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8204/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  extraction-engine:
    depends_on:
      - postgresql
    image: hub.chopinsight.cn/chopinsight/internalimages/extraction_engine:latest
    environment:
      # PostgreSQL (同 stack 内直接用服务名；读 chong_*_vector_v1)
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=chopinsight
      - PG_PASSWORD={{PG_PASSWORD}}
      - PG_DB=chopinsight
      # Ollama (统一 AI 服务)
      - QWEN_OLLAMA_BASE_URL=https://ollama.chopinsight.cn/v1
      - QWEN_OLLAMA_API_KEY={{OLLAMA_API_KEY}}
      - OLLAMA_EMBED_MODEL=bge-m3:latest
      - OLLAMA_CHAT_MODEL=aiursoft-instruct:latest
    networks:
      - internal
      - proxy_app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8205/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

networks:
  frp_net:
    external: true
  internal:
    driver: overlay
  pg_net:
    driver: overlay
  proxy_app:
    external: true
  clickhouse_net:
    external: true

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/chopinsight-postgres/postgres-database
  findata-pdfs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/findata-engine/pdfs
