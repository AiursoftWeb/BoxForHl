version: '3.9'

services:
  postgresql:
    image: hub.chopinsight.cn/postgres:16-alpine
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: {{PG_PASSWORD}}
      POSTGRES_USER: chopinsight
      POSTGRES_DB: chopinsight
    networks:
      - frp_net
      - internal
    ports:
      # These ports are for internal use. For external, FRP will handle it.
      # PostgreSQL default port
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

  findata-engine:
    depends_on:
      - postgresql
    image: hub.chopinsight.cn/chopinsight/internalimages/findata_engine:latest
    environment:
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=chopinsight
      - PG_PASSWORD={{PG_PASSWORD}}
      - PG_DB=chopinsight
      - EMBEDDING_API_URL={{FINDATA_EMBEDDING_API_URL}}
      - EMBEDDING_API_KEY={{FINDATA_EMBEDDING_API_KEY}}
      - OCR_API_URL=http://ocr_app:8000/api/ocr
      - USE_GPU=false
      - MAX_CONCURRENT_TASKS=5
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      start_period: 30s
      interval: 30s
      retries: 3
      timeout: 10s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

networks:
  frp_net:
    external: true
  internal:
    driver: overlay

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/chopinsight-postgres/postgres-database
