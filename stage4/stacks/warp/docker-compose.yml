version: "3.9"

services:
  app:
    depends_on:
      - db
    image: hub.hlwuxi.com/aiursoft/warp:latest
    volumes:
      - warp-aspnet:/data/.aspnet/
      - warp-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=warp;Uid=warp;Pwd=<warp_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.hlwuxi.com/application/o/warp
      - AppSettings__OIDC__ClientId={{WARP_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{WARP_CLIENT_SECRET}}
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=WarpLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  db:
    image: hub.hlwuxi.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - warp-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=warp
      - MYSQL_USER=warp
      - MYSQL_PASSWORD=<warp_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  warp-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/warp-data/files
  warp-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/warp-data/aspnet
  warp-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/warp-data/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay
