ollama.chopinsight.cn {
    log
    import hsts
    encode br gzip

    handle /v1/messages* {
        reverse_proxy http://ai_anthropic-proxy:5000
    }

    handle /v1/usage {
        reverse_proxy http://ai_anthropic-proxy:5000
    }

    handle {
        reverse_proxy http://ai_ollama-gateway-app:5000
    }
}

# Untrusted
openweb.chopinsight.cn {
    log
    import hsts
    encode br gzip
    reverse_proxy http://ai_open-webui:8080
}
