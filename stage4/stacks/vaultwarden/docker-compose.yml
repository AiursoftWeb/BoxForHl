version: '3.9'

services:
  app:
    image: hub.hlwuxi.com/vaultwarden/server:latest
    volumes:
      - vaultwarden-data:/data/
    networks:
      - proxy_app
    environment:
      - DOMAIN=https://vault.hlwuxi.com
      - SSO_ENABLED=true
      - SSO_AUTHORITY=https://auth.hlwuxi.com/application/o/vaultwarden/
      - SSO_CLIENT_ID={{VAULTWARDEN_CLIENT_ID}}
      - SSO_CLIENT_SECRET={{VAULTWARDEN_CLIENT_SECRET}}
      - SSO_SCOPES="openid email profile offline_access"
      - SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION=true
      - SSO_CLIENT_CACHE_EXPIRATION=300
      - SSO_ONLY=true
      - SSO_SIGNUPS_MATCH_EMAIL=true
      - ADMIN_TOKEN={{VAULTWARDEN_ADMIN_TOKEN}}
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      update_config:
        order: stop-first
        delay: 60s
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.2'
          memory: 256M
      restart_policy:
        delay: 5s
        max_attempts: 3
        window: 120s

networks:
  proxy_app:
    external: true

volumes:
  vaultwarden-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/vaultwarden-data/data
