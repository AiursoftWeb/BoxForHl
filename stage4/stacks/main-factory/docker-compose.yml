version: "3.9"

services:
  app:
    image: hub.chopinsight.cn/chopinsight/emeicang_services/main_factory:latest

    volumes:
      - /swarm-vol/env/main-factory/.env.prod:/app/.env:ro
      - /swarm-vol/pg/main-factory-pdfs:/tmp/pdf

    environment:
      # MySQL（findata 业务库）
      MYSQL_HOST: 139.9.132.162
      MYSQL_PORT: 3306
      MYSQL_USER: db_yuzhong_v2
      MYSQL_PASSWORD: "{{FINDATA_MYSQL_PASSWORD}}"
      MYSQL_DB: db_yuzhong_v2

      # PostgreSQL（chopinsight 主库）
      PG_HOST: postgresql
      PG_PORT: 5432
      PG_USER: chopinsight
      PG_PASSWORD: "{{PG_PASSWORD}}"
      PG_DB: chopinsight

      # ClickHouse 日志（可选）
      CLICKHOUSE_HOST: clickhouse_clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "{{CLICKHOUSE_PASSWORD}}"
      CLICKHOUSE_DB: main_factory

      # 飞书通知（可选，未配置 secret 时留空）
      FEISHU_WEBHOOK: ""

      # LLM API Keys
      ZHIPU_API_KEY: "{{ZHIPU_API_KEY}}"
      DEEPSEEK_API_KEY: "{{DEEPSEEK_API_KEY}}"
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      VOLC_ARK_API_KEY: "{{DOUBAO_API_KEY}}"

      # OCR（自有 OCR 服务，已替代 MinerU）
      CUSTOMER_OCR_BASE_URL: https://customer-ocr.chopinsight.cn
      CUSTOMER_OCR_TOKEN: "{{OCR_ACCESS_TOKEN}}"

      # 文件路径
      PDF_DIR: /tmp/pdf/
      PDF_IMAGES_DIR: /tmp/pdf/images
      EXCEL_DIR: /tmp/excel/
      TEMP_DIR: /tmp/tmp

      # 日志
      LOG_INFO: /tmp/log_main_factory_info.log
      LOG_ERROR: /tmp/log_main_factory_error.log
      LOG_DEBUG: /tmp/log_main_factory_debug.log
      LOG_STDOUT: "true"

      # 财报向量化
      FINREPORT_AUTO_VECTORIZE: "false"
      FINREPORT_VECTOR_DB_TYPE: milvus_lite
      FINREPORT_MILVUS_PATH: /tmp/fin_report_milvus_lite.db

      # 服务
      PORT: 8210
      HOST: 0.0.0.0

    networks:
      - internal
      - proxy_app
      - clickhouse_net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8210/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    stop_grace_period: 20s

    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G
      labels:
        - "shepherd.autoupdate=true"

networks:
  internal:
    external: true
    name: pg_net
  proxy_app:
    external: true
    name: proxy_app
  clickhouse_net:
    external: true
    name: clickhouse_net
