global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: operation-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["pg_operation-engine:8000"]
        labels:
          service: operation-engine

  - job_name: findata-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["pg_findata-engine:8200"]
        labels:
          service: findata-engine
