version: '3.9'

services:
  prometheus:
    image: hub.hlwuxi.com/prom/prometheus:latest
    volumes:
      - prometheus-config:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - proxy_app
    stop_grace_period: 30s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      update_config:
        order: start-first
        delay: 5s

  loki:
    image: hub.hlwuxi.com/grafana/loki:3.7.2
    volumes:
      - loki-config:/etc/loki:ro
      - loki-data:/loki
    networks:
      - internal
    command:
      - '-config.file=/etc/loki/loki-config.yaml'
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

  alloy:
    depends_on:
      - loki
    image: hub.hlwuxi.com/grafana/alloy:v1.19.2
    volumes:
      - alloy-config:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - nextcloud-logs:/var/log/nextcloud:ro
    networks:
      - internal
    command:
      - 'run'
      - '--storage.path=/var/lib/alloy/data'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '/etc/alloy/config.alloy'
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      update_config:
        order: stop-first
        delay: 60s

  grafana:
    depends_on:
      - prometheus
      - loki
    image: hub.hlwuxi.com/grafana/grafana
    volumes:
      - grafana-config:/etc/grafana
      - grafana-data:/var/lib/grafana
    environment:
      - TZ=UTC
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_ROOT_URL=https://grafana.hlwuxi.com
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID={{GRAFANA_CLIENT_ID}}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET={{GRAFANA_CLIENT_SECRET}}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.hlwuxi.com/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.hlwuxi.com/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.hlwuxi.com/application/o/userinfo/
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://auth.hlwuxi.com/application/o/grafana/end-session/
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
      - "GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups, 'grafana-admins') && 'Admin' || contains(groups, 'grafana-editors') && 'Editor' || 'Viewer'"
      - GF_AUTH_GENERIC_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_GENERIC_ROLE_ATTRIBUTE_STRICT=true
      - GF_AUTH_OAUTH_AUTO_LOGIN=true
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=true
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    networks:
      - proxy_app
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

networks:
  proxy_app:
    external: true
  internal:
    driver: overlay

volumes:
  prometheus-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/health/prometheus-config
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/health/prometheus-data
  grafana-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/health/grafana-config
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/health/grafana-data
  loki-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/health/loki-config
  loki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/health/loki-data
  alloy-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/health/alloy-config
  alloy-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/health/alloy-data
  nextcloud-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/nextcloud/data
