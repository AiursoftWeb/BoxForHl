version: '3.9'

services:
  minio:
    image: hub.chopinsight.cn/minio/minio:latest
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER={{MINIO_ROOT_USER}}
      - MINIO_ROOT_PASSWORD={{MINIO_ROOT_PASSWORD}}
    networks:
      - proxy_app
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: stop-first
        delay: 10s

networks:
  proxy_app:
    external: true
  internal:
    driver: overlay

volumes:
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/minio/data
