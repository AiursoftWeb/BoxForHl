version: '3.9'

services:
  app:
    image: hub.chopinsight.cn/chopinsight/internalimages/chinalife_service:latest
    environment:
      - MYSQL_HOST=139.9.132.162
      - MYSQL_PORT=3306
      - MYSQL_USER=db_yuzhong_v2
      - MYSQL_PASSWORD={{MYSQL_PASSWORD}}
      - MYSQL_DB=db_yuzhong_v2
    networks:
      - internal
      - proxy_app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8210/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

networks:
  internal:
    driver: overlay
  proxy_app:
    external: true
