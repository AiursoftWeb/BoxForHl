version: '3.9'

services:
  chat:
    image: hub.chopinsight.cn/chopinsight/internalimages/chopchat:latest
    environment:
      # MySQL 鉴权（db_yuzhong_v2，用户/会话管理）
      - MYSQL_HOST=139.9.132.162
      - MYSQL_PORT=3306
      - MYSQL_USER=db_yuzhong_v2
      - MYSQL_PASSWORD={{MYSQL_PASSWORD}}
      - MYSQL_DATABASE=db_yuzhong_v2
      # MySQL 只读 Agent（MCP / RAG 业务查询，仅可访问 chong_* 表）
      - MYSQL_AGENT_USER=readonly_agent
      - MYSQL_AGENT_PASSWORD={{MYSQL_AGENT_PASSWORD}}
      # LLM API（外网服务）
      - DOUBAO_API_KEY={{DOUBAO_API_KEY}}
      - DOUBAO_BASE_URL=https://ark.cn-beijing.volces.com/api/v3
      - DEEPSEEK_API_KEY={{DEEPSEEK_API_KEY}}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com
      - QWEN_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - QWEN_API_KEY={{QWEN_API_KEY}}
      # Ollama（统一 AI 服务，走 proxy_app 软路由）
      - QWEN_OLLAMA_BASE_URL=https://ollama.chopinsight.cn/v1
      - QWEN_OLLAMA_API_KEY={{OLLAMA_API_KEY}}
      - OLLAMA_EMBED_MODEL=bge-m3:latest
      - EMBEDDING_ENGINE=ollama
      # PostgreSQL（pg stack 内部网络）
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=chopinsight
      - PG_PASSWORD={{PG_PASSWORD}}
      - PG_DBNAME=chopinsight
      # MinIO（对象存储，内部网络）
      - MINIO_ENDPOINT=minio_minio:9000
      - MINIO_ACCESS_KEY={{MINIO_ROOT_USER}}
      - MINIO_SECRET_KEY={{MINIO_ROOT_PASSWORD}}
      - MINIO_BUCKET=chopchat-ppt-images
      - MINIO_SECURE=false
      - MINIO_EXTERNAL_URL=https://minio.chopinsight.cn
      # OCR 服务（内部网络）
      - OCR_API_URL=http://customerocr:8100/api/ocr
      - OCR_BASE64_URL=http://customerocr:8100/api/ocr/base64
      - OCR_PDF_API_URL=http://customerocr:8100/api/ocr/pdf
      - OCR_ACCESS_TOKEN={{OCR_ACCESS_TOKEN}}
      # 邮件服务（外部 SMTP）
      - SMTP_HOST=mail.aiursoft.com
      - SMTP_PORT=465
      - SMTP_SENDER=service@chopinsight.cn
      - SMTP_PASSWORD={{SMTP_PASSWORD}}
      - SMTP_SENDER_NAME=ChopChat 系统通知
      # IMAP 审批邮件（外部 IMAP）
      - IMAP_HOST=mail.aiursoft.com
      - IMAP_USER=service@chopinsight.cn
      - IMAP_PASSWORD={{IMAP_PASSWORD}}
      - IMAP_WHITELIST=clare.xu@chopinsight.cn
      # 服务配置
      - DEBUG=false
      # ClickHouse 日志
      - CLICKHOUSE_HOST=clickhouse_clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD={{CLICKHOUSE_PASSWORD}}
      - CLICKHOUSE_DB=chopchat
    networks:
      - pg_internal
      - proxy_app
      - clickhouse_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 1G
      labels:
        - "shepherd.autoupdate=true"

  chopchat-initializer:
    image: hub.chopinsight.cn/chopinsight/internalimages/chopchat_initializer:latest
    environment:
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=chopinsight
      - PG_PASSWORD={{PG_PASSWORD}}
      - PG_DB=chopinsight
    networks:
      - pg_internal
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  proxy_app:
    external: true
  pg_internal:
    external: true
  clickhouse_net:
    external: true
