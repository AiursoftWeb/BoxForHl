version: '3.9'

services:
  app:
    image: hub.chopinsight.cn/chopinsight/internalimages/chopchat:latest
    env_file:
      - .env
    networks:
      - proxy_app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
      update_config:
        order: start-first
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

networks:
  proxy_app:
    external: true
