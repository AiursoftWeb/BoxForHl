version: '3.9'

services:
  server:
    image: localhost:8080/box_starting/local_zot
    environment:
      - HTTP_PROXY=http://xray:10809
      - HTTPS_PROXY=http://xray:10809
      - NO_PROXY=hub.hlwuxi.com,10.0.0.0/8,localhost,127.0.0.1
    volumes:
      - zot-blob:/data
      - zot-config:/config
    networks:
      - proxy_app
      - xray_net
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  zot-blob:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/zot-data/blob
  zot-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/zot-data/config

networks:
  proxy_app:
    external: true
  xray_net:
    external: true
