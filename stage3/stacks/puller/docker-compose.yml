version: '3.9'

services:
  # Mission: Pull Public Images (PI) and Aiursoft Modified Images (MI) from Docker Hub
  downloader:
    image: localhost:8080/box_starting/local_puller
    environment:
      - MIRROR_TARGET=hub.hlwuxi.com
      - DOCKER_USERNAME={{PUBLIC_DOCKER_HUB_USERNAME}}
      - DOCKER_PASSWORD={{PUBLIC_DOCKER_HUB_PASSWORD}}
      - DOCKERHUB_USERNAME={{DOCKERHUB_USERNAME}}
      - DOCKERHUB_PASSWORD={{DOCKERHUB_PASSWORD}}
      - HTTP_PROXY=http://xray:10809
      - HTTPS_PROXY=http://xray:10809
      - NO_PROXY=hub.hlwuxi.com,10.0.0.0/8,localhost,127.0.0.1
    volumes:
      - sync_records:/app/sync_records
      - run_logs:/app/run_logs
    networks:
      - proxy_app
      - xray_net
    stop_grace_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: start-first
        delay: 5s

networks:
  proxy_app:
    external: true
  xray_net:
    external: true

volumes:
  sync_records:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/puller-data/sync_records
  run_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/puller-data/run_logs
